#@TYPE: Machine
#@NAME: Orange Pi Zero 2 (Allwinner H616)
#@DESCRIPTION: Orange Pi Zero 2 512 MiB and 1 GiB variants

MACHINEOVERRIDES =. "sunxi:h616:"

require conf/machine/include/arm/armv8a/tune-cortexa53.inc

DEFAULTTUNE = "cortexa53"

KERNEL_IMAGETYPE = "Image"
KERNEL_DEVICETREE = "allwinner/sun50i-h616-orangepi-zero2.dtb"
PREFERRED_PROVIDER_virtual/kernel = "linux-orangepi"
KERNEL_VERSION_SANITY_SKIP = "1"
KERNEL_MODULE_AUTOLOAD:append = " uvcvideo"

SERIAL_CONSOLES ?= "115200;ttyS0"

PREFERRED_PROVIDER_virtual/bootloader = "u-boot-orangepi"
UBOOT_MACHINE = "orangepi_zero2_defconfig"
UBOOT_BINARY = "u-boot-sunxi-with-spl.bin"

# Keep a normal root filesystem artifact and produce an SD-card image.  The
# raw U-Boot payload is placed at the Allwinner/Sunxi 8 KiB boot offset by the
# Wic kickstart file in this layer.
# Emit an uncompressed Wic image so the Actions artifact can be written to a
# TF card directly with dd. Both 512 MiB and 1 GiB boards use this layout.
IMAGE_FSTYPES += "tar.bz2 ext4 wic"
WKS_FILE = "orangepi-zero2.wks.in"
WKS_FILE_DEPENDS = "wic-native dosfstools-native mtools-native e2fsprogs-native \
                    u-boot-orangepi orangepi-boot-files orangepi-fixed-kernel-dtb"
IMAGE_BOOT_FILES = " \
    Image;Image \
    sun50i-h616-orangepi-zero2-openbmc.dtb;sun50i-h616-orangepi-zero2.dtb \
    orangepi-zero2-extlinux.conf;extlinux/extlinux.conf \
    uboot.env;uboot.env \
    "

# The OpenBMC image is intentionally the complete image recipe.  This layer
# only adds board-specific packages and hardware integration.
DISTRO_FEATURES:append = " systemd"
