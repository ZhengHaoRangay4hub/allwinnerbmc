name: Orange Pi Zero 2 OpenBMC
run-name: "${{ inputs.preflight_only && 'OpenBMC board preflight' || 'OpenBMC TF-card image' }} #${{ github.run_number }}"

on:
  workflow_dispatch:
    inputs:
      preflight_only:
        description: 'Validate board recipes only; does not produce a flashable image'
        required: false
        default: false
        type: boolean
      checkpoint:
        description: 'Internal checkpoint number for resumable builds'
        required: false
        default: '0'
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  # A preflight must never cancel an in-progress full image build.
  # Preserve the existing full-build group across workflow revisions.
  group: ${{ inputs.preflight_only && 'orangepi-zero2-preflight' || 'orangepi-zero2-openbmc' }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ inputs.preflight_only && 'OpenBMC board preflight (no image)' || 'OpenBMC TF-card image' }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.preflight_only && 60 || 360 }}
    outputs:
      checkpointed: ${{ steps.build_boot.outputs.checkpointed == 'true' || steps.build_image.outputs.checkpointed == 'true' }}
      cache_saved: ${{ steps.save_cache.outcome == 'success' }}
    env:
      DEBIAN_FRONTEND: noninteractive
      # The standard hosted runner has four vCPUs.  Avoiding a 24-worker
      # oversubscription keeps the runner responsive and reduces host-side
      # pressure during the long native-toolchain phase.
      BB_NUMBER_THREADS: "8"
      BB_NUMBER_PARSE_THREADS: "4"
      PARALLEL_MAKE: "-j4"
      CHECKPOINT_NUMBER: ${{ inputs.checkpoint || '0' }}
      OPENBMC_BUILD_BUDGET_SECONDS: ${{ inputs.preflight_only && '1200' || '18000' }}

    steps:
      - name: Check out port sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Test checkpoint and failure handling
        run: python3 -m unittest discover -s tests -v

      - name: Reclaim runner disk space
        shell: bash
        run: |
          set -euxo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/powershell
          df -h

      - name: Install build dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential chrpath cpio device-tree-compiler diffstat e2fsprogs \
            flex gawk gcc-aarch64-linux-gnu git libelf-dev liblz4-tool \
            libncurses-dev libssl-dev locales lz4 make mtools patch \
            python3 python3-pip python3-setuptools python3-pexpect python3-git python3-jinja2 \
            python3-subunit rsync socat texinfo unzip wget xterm zstd
          sudo apt-get install -y --no-install-recommends u-boot-tools

      - name: Test TF-card image verification with real filesystems
        env:
          OPENBMC_REQUIRE_IMAGE_TOOLS: "1"
        run: python3 -m unittest discover -s tests -p 'test_tf_image.py' -v

      - name: Configure locale
        run: |
          sudo locale-gen en_US.UTF-8
          echo "LANG=en_US.UTF-8" >> "$GITHUB_ENV"
          echo "LC_ALL=en_US.UTF-8" >> "$GITHUB_ENV"

      - name: Cache Yocto downloads and sstate
        uses: actions/cache/restore@v4
        with:
          path: |
            yocto-downloads
            yocto-sstate
          key: yocto-orangepi-zero2-${{ hashFiles('sources/versions.txt', 'meta-orangepi/**') }}-${{ github.run_id }}
          restore-keys: |
            yocto-orangepi-zero2-${{ hashFiles('sources/versions.txt', 'meta-orangepi/**') }}-
            yocto-orangepi-zero2-${{ hashFiles('sources/versions.txt', 'meta-orangepi/**') }}
            yocto-orangepi-zero2-

      - name: Fetch kernel configuration reference from GitHub
        shell: bash
        run: |
          set -Eeuo pipefail

          clone_ref() {
            local repo="$1" ref="$2" dest="$3"
            rm -rf "$dest"
            git clone --depth 1 --single-branch --branch "$ref" \
              "https://github.com/${repo}.git" "$dest"
          }

          clone_ref orangepi-xunlong/linux-orangepi orange-pi-6.1-sun50iw9 linux-orangepi
          test "$(git -C linux-orangepi rev-parse HEAD)" = \
            "$(sed -n 's/^Linux commit: //p' sources/versions.txt)"
          # Use the same patch implementation and strict context as BitBake QA.
          for board_patch in "$GITHUB_WORKSPACE/meta-orangepi/recipes-kernel/linux/files/"*.patch; do
            patch --batch --forward --fuzz=0 -p1 -d linux-orangepi -i "$board_patch"
          done

      - name: Generate Linux defconfig for OpenBMC
        shell: bash
        run: |
          set -Eeuo pipefail
          make -C linux-orangepi O="$GITHUB_WORKSPACE/linux-build" \
            ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- linux_sunxi64_defconfig
          linux-orangepi/scripts/config --file "$GITHUB_WORKSPACE/linux-build/.config" \
            -e MFD_AC200 -e VFAT_FS -e NLS_CODEPAGE_437 \
            -e NLS_ISO8859_1 -e NLS_UTF8
          make -C linux-orangepi O="$GITHUB_WORKSPACE/linux-build" \
            ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig

          cp "$GITHUB_WORKSPACE/linux-build/.config" \
            "$GITHUB_WORKSPACE/meta-orangepi/recipes-kernel/linux/files/defconfig"

      - name: Prepare OpenBMC board layer and caches
        shell: bash
        run: |
          set -Eeuo pipefail
          cp -a meta-orangepi openbmc/meta-orangepi
          git -C openbmc apply \
            "$GITHUB_WORKSPACE/meta-orangepi/files/0001-github-actions-skip-userns-sanity-check.patch"
          git -C openbmc apply \
            "$GITHUB_WORKSPACE/meta-orangepi/files/0002-github-actions-skip-bitbake-network-isolation.patch"
          sanity_file="$GITHUB_WORKSPACE/openbmc/upstream-layers/openembedded-core/meta/classes-global/sanity.bbclass"
          sed -i '/^[[:space:]]*status.addresult(check_userns())[[:space:]]*$/d' "$sanity_file"
          if grep -n 'status\.addresult(check_userns())' "$sanity_file"; then
            echo 'user namespace sanity check was not removed'
            exit 1
          fi
          worker_file="$GITHUB_WORKSPACE/openbmc/upstream-layers/bitbake/bin/bitbake-worker"
          sed -i "/if not bb.utils.to_boolean(the_data.getVarFlag(taskname, 'network')):/c\\                if False:" "$worker_file"
          if grep -n "getVarFlag(taskname, 'network')" "$worker_file"; then
            echo 'BitBake worker network isolation was not disabled'
            exit 1
          fi
          mkdir -p yocto-downloads yocto-sstate

          cd openbmc
          set +u
          TEMPLATECONF=meta-orangepi/conf/templates/default \
            . ./setup orangepi-zero2 "$GITHUB_WORKSPACE/openbmc-build"
          set -u

          cat >> "$GITHUB_WORKSPACE/openbmc-build/conf/local.conf" <<EOF
          BB_NUMBER_THREADS = "8"
          BB_NUMBER_PARSE_THREADS = "4"
          PARALLEL_MAKE = "-j4"
          PARALLEL_MAKE:pn-gcc-cross-aarch64 = "-j4"
          DL_DIR = "$GITHUB_WORKSPACE/yocto-downloads"
          SSTATE_DIR = "$GITHUB_WORKSPACE/yocto-sstate"
          BB_HASHSERVE_DB_DIR = "$GITHUB_WORKSPACE/yocto-sstate"
          TMPDIR = "$GITHUB_WORKSPACE/yocto-tmp"
          # GitHub-hosted runners have direct Internet access. Do not carry
          # the domestic proxy from the shared-cluster local.conf template
          # into this workflow.
          PREMIRRORS = ""
          PREMIRRORS:prepend = ""
          MIRRORS = ""
          # The vendored OpenBMC tree has no separate .git directory. Use
          # the checked-out repository for OpenBMC version metadata.
          OS_RELEASE_ROOTPATH = "$GITHUB_WORKSPACE"
          HOSTTOOLS_NONFATAL:append = " chrpath rpcgen"
          HOSTTOOLS:remove = " chrpath rpcgen"
          BBPATH:prepend = "$GITHUB_WORKSPACE/openbmc/upstream-layers/openembedded-core/meta:"
          CONNECTIVITY_CHECK_URIS = ""
          EOF

          zlib_tar="$GITHUB_WORKSPACE/yocto-downloads/zlib-1.3.2.tar.gz"
          zlib_expected="bb329a0a2cd0274d05519d61c667c062e06990d72e125ee2dfa8de64f0119d16"
          if [ -f "$zlib_tar" ] && [ "$(sha256sum "$zlib_tar" | awk '{print $1}')" != "$zlib_expected" ]; then
            echo 'Removing corrupted cached zlib-1.3.2.tar.gz before BitBake fetch'
            rm -f "$zlib_tar"
          fi

      - name: Validate OpenBMC boot components and board helpers (checkpointable)
        id: build_boot
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$GITHUB_WORKSPACE/openbmc"
          set +u
          . ./oe-init-build-env "$GITHUB_WORKSPACE/openbmc-build"
          set -u
          bash "$GITHUB_WORKSPACE/scripts/ci-build-stage.sh" boot

      - name: Require completed boot preflight
        if: inputs.preflight_only && steps.build_boot.outputs.checkpointed == 'true'
        run: |
          echo '::error::Board preflight exceeded its time budget; it is not a successful validation.'
          exit 1

      - name: Validate kernel configuration and driver objects (preflight only)
        if: inputs.preflight_only && success()
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$GITHUB_WORKSPACE/openbmc"
          set +u
          . ./oe-init-build-env "$GITHUB_WORKSPACE/openbmc-build"
          set -u
          timeout --signal=TERM --kill-after=2m 20m \
            bitbake -c board_preflight virtual/kernel 2>&1 | tee "$GITHUB_WORKSPACE/openbmc-kernel-config.log"
          echo 'Board recipes passed preflight. This run does not produce a flashable image.' \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Build full OpenBMC image (checkpointable)
        id: build_image
        if: "!inputs.preflight_only && success() && steps.build_boot.outputs.checkpointed != 'true'"
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$GITHUB_WORKSPACE/openbmc"
          set +u
          . ./oe-init-build-env "$GITHUB_WORKSPACE/openbmc-build"
          set -u
          bash "$GITHUB_WORKSPACE/scripts/ci-build-stage.sh" image

      # Preserve completed Yocto work even when BitBake fails.  The next run
      # restores this cache and reuses sstate instead of rebuilding everything.
      - name: Save Yocto downloads and sstate after build attempt
        id: save_cache
        # Preflights only read caches; they must not replace a fuller image cache.
        if: always() && !inputs.preflight_only
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            yocto-downloads
            yocto-sstate
          key: yocto-orangepi-zero2-${{ hashFiles('sources/versions.txt', 'meta-orangepi/**') }}-${{ github.run_id }}

      - name: Require a saved cache before continuing a checkpoint
        if: >-
          always() &&
          !inputs.preflight_only &&
          (steps.build_boot.outputs.checkpointed == 'true' || steps.build_image.outputs.checkpointed == 'true') &&
          steps.save_cache.outcome != 'success'
        run: |
          echo '::error::The build reached its checkpoint but the cache could not be saved.'
          exit 1

      - name: Collect TF-card image and checksums
        if: >-
          success() &&
          steps.build_image.outcome == 'success' &&
          steps.build_image.outputs.checkpointed != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          deploy="$GITHUB_WORKSPACE/yocto-tmp/deploy/images/orangepi-zero2"
          out="$GITHUB_WORKSPACE/tf-card-image"
          test -d "$deploy"
          mkdir -p "$out"
          # The deliverable is the complete, directly flashable SD image.
          find "$deploy" -maxdepth 1 -type f -name '*.wic' \
            -exec cp -a {} "$out/" \;
          test -n "$(find "$out" -type f -name '*.wic' -print -quit)"
          (cd "$out" && sha256sum ./*.wic > SHA256SUMS && sha256sum -c SHA256SUMS)
          for image in "$out"/*.wic; do
            python3 "$GITHUB_WORKSPACE/scripts/verify-tf-image.py" "$image" \
              > "$image.verification.json"
          done

      - name: Upload TF-card image
        if: >-
          success() &&
          steps.build_image.outcome == 'success' &&
          steps.build_image.outputs.checkpointed != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: orangepi-zero2-tf-card-image-${{ github.run_number }}
          path: tf-card-image/
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orangepi-zero2-build-diagnostics-${{ github.run_number }}
          path: |
            openbmc-boot.log
            openbmc-kernel-config.log
            openbmc-bitbake.log
            openbmc-build/conf/*.conf
            yocto-tmp/log/cooker/**
            yocto-tmp/work/**/temp/log.do_*
          if-no-files-found: warn
          retention-days: 7

  continue-checkpointed-build:
    name: Continue checkpointed Yocto build
    needs: build
    if: >-
      !inputs.preflight_only &&
      needs.build.result == 'success' &&
      needs.build.outputs.checkpointed == 'true' &&
      needs.build.outputs.cache_saved == 'true' &&
      fromJSON(inputs.checkpoint || '0') < 5
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch next checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKPOINT_NUMBER: ${{ inputs.checkpoint || '0' }}
        run: |
          set -Eeuo pipefail
          next_checkpoint=$((CHECKPOINT_NUMBER + 1))
          gh workflow run build-orangepi-zero2-image.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f checkpoint="$next_checkpoint"
