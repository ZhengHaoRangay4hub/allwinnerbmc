name: Orange Pi Zero 2 OpenBMC

on:
  workflow_dispatch:
    inputs:
      checkpoint:
        description: 'Internal checkpoint number for resumable builds'
        required: false
        default: '0'
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  # This workflow is deliberately manual-only.  A single stable group keeps
  # an accidental duplicate dispatch from consuming another hosted runner.
  group: orangepi-zero2-openbmc
  cancel-in-progress: true

jobs:
  build:
    name: OpenBMC TF-card image
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    outputs:
      checkpointed: ${{ steps.build_image.outputs.checkpointed }}
    env:
      DEBIAN_FRONTEND: noninteractive
      # The standard hosted runner has four vCPUs.  Avoiding a 24-worker
      # oversubscription keeps the runner responsive and reduces host-side
      # pressure during the long native-toolchain phase.
      BB_NUMBER_THREADS: "8"
      BB_NUMBER_PARSE_THREADS: "4"
      PARALLEL_MAKE: "-j4"
      CHECKPOINT_NUMBER: ${{ inputs.checkpoint || '0' }}

    steps:
      - name: Check out port sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Reclaim runner disk space
        shell: bash
        run: |
          set -euxo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/powershell
          df -h

      - name: Install build dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential chrpath cpio device-tree-compiler diffstat \
            flex gawk gcc-aarch64-linux-gnu git libelf-dev liblz4-tool \
            libncurses-dev libssl-dev locales lz4 make patch \
            python3 python3-pip python3-setuptools python3-pexpect python3-git python3-jinja2 \
            python3-subunit rsync socat texinfo unzip wget xterm zstd
          sudo apt-get install -y --no-install-recommends u-boot-tools

      - name: Configure locale
        run: |
          sudo locale-gen en_US.UTF-8
          echo "LANG=en_US.UTF-8" >> "$GITHUB_ENV"
          echo "LC_ALL=en_US.UTF-8" >> "$GITHUB_ENV"

      - name: Cache Yocto downloads and sstate
        uses: actions/cache@v4
        with:
          path: |
            yocto-downloads
            yocto-sstate
          key: yocto-orangepi-zero2-${{ hashFiles('sources/versions.txt', 'meta-orangepi/**') }}-${{ github.run_id }}
          restore-keys: |
            yocto-orangepi-zero2-${{ hashFiles('sources/versions.txt', 'meta-orangepi/**') }}-
            yocto-orangepi-zero2-${{ hashFiles('sources/versions.txt', 'meta-orangepi/**') }}
            yocto-orangepi-zero2-

      - name: Fetch Linux and U-Boot from GitHub
        shell: bash
        run: |
          set -Eeuo pipefail

          clone_ref() {
            local repo="$1" ref="$2" dest="$3"
            rm -rf "$dest"
            git clone --depth 1 --single-branch --branch "$ref" \
              "https://github.com/${repo}.git" "$dest"
          }

          clone_ref orangepi-xunlong/linux-orangepi orange-pi-6.1-sun50iw9 linux-orangepi
          clone_ref orangepi-xunlong/u-boot-orangepi v2021.10-sunxi u-boot-orangepi

          git -C u-boot-orangepi apply \
            "$GITHUB_WORKSPACE/meta-orangepi/recipes-bsp/u-boot/files/0001-pylibfdt-use-setuptools-on-modern-python.patch"

          git -C linux-orangepi apply \
            "$GITHUB_WORKSPACE/meta-orangepi/recipes-kernel/linux/files/0001-uwe5622-fix-out-of-tree-include-paths.patch" \
            "$GITHUB_WORKSPACE/meta-orangepi/recipes-kernel/linux/files/0002-sun50i-cpufreq-nvmem-use-opp-token-type.patch"

          test "$(git -C linux-orangepi rev-parse HEAD)" = \
            "$(sed -n 's/^Linux commit: //p' sources/versions.txt)"
          test "$(git -C u-boot-orangepi rev-parse HEAD)" = \
            "$(sed -n 's/^U-Boot commit: //p' sources/versions.txt)"

      - name: Generate Linux defconfig for OpenBMC
        shell: bash
        run: |
          set -Eeuo pipefail
          make -C linux-orangepi O="$GITHUB_WORKSPACE/linux-build" \
            ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- linux_sunxi64_defconfig
          linux-orangepi/scripts/config --file "$GITHUB_WORKSPACE/linux-build/.config" \
            -e MFD_AC200
          make -C linux-orangepi O="$GITHUB_WORKSPACE/linux-build" \
            ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig

          cp "$GITHUB_WORKSPACE/linux-build/.config" \
            "$GITHUB_WORKSPACE/meta-orangepi/recipes-kernel/linux/files/defconfig"

      - name: Prepare OpenBMC board layer and local sources
        shell: bash
        run: |
          set -Eeuo pipefail
          cp -a meta-orangepi openbmc/meta-orangepi
          git -C openbmc apply \
            "$GITHUB_WORKSPACE/meta-orangepi/files/0001-github-actions-skip-userns-sanity-check.patch"
          git -C openbmc apply \
            "$GITHUB_WORKSPACE/meta-orangepi/files/0002-github-actions-skip-bitbake-network-isolation.patch"
          sanity_file="$GITHUB_WORKSPACE/openbmc/upstream-layers/openembedded-core/meta/classes-global/sanity.bbclass"
          sed -i '/^[[:space:]]*status.addresult(check_userns())[[:space:]]*$/d' "$sanity_file"
          if grep -n 'status\.addresult(check_userns())' "$sanity_file"; then
            echo 'user namespace sanity check was not removed'
            exit 1
          fi
          worker_file="$GITHUB_WORKSPACE/openbmc/upstream-layers/bitbake/bin/bitbake-worker"
          sed -i "/if not bb.utils.to_boolean(the_data.getVarFlag(taskname, 'network')):/c\\                if False:" "$worker_file"
          if grep -n "getVarFlag(taskname, 'network')" "$worker_file"; then
            echo 'BitBake worker network isolation was not disabled'
            exit 1
          fi
          mkdir -p yocto-downloads yocto-sstate

          cd openbmc
          set +u
          TEMPLATECONF=meta-orangepi/conf/templates/default \
            . ./setup orangepi-zero2 "$GITHUB_WORKSPACE/openbmc-build"
          set -u

          cat >> "$GITHUB_WORKSPACE/openbmc-build/conf/local.conf" <<EOF
          BB_NUMBER_THREADS = "8"
          BB_NUMBER_PARSE_THREADS = "4"
          PARALLEL_MAKE = "-j4"
          PARALLEL_MAKE:pn-gcc-cross-aarch64 = "-j4"
          DL_DIR = "$GITHUB_WORKSPACE/yocto-downloads"
          SSTATE_DIR = "$GITHUB_WORKSPACE/yocto-sstate"
          TMPDIR = "$GITHUB_WORKSPACE/yocto-tmp"
          # GitHub-hosted runners have direct Internet access. Do not carry
          # the domestic proxy from the shared-cluster local.conf template
          # into this workflow.
          PREMIRRORS = ""
          MIRRORS = ""
          # The vendored OpenBMC tree has no separate .git directory. Use
          # the checked-out repository for OpenBMC version metadata.
          OS_RELEASE_ROOTPATH = "$GITHUB_WORKSPACE"
          HOSTTOOLS_NONFATAL:append = " chrpath rpcgen"
          HOSTTOOLS:remove = " chrpath rpcgen"
          BBPATH:prepend = "$GITHUB_WORKSPACE/openbmc/upstream-layers/openembedded-core/meta:"
          EXTERNALSRC:pn-linux-orangepi = "$GITHUB_WORKSPACE/linux-orangepi"
          EXTERNALSRC_BUILD:pn-linux-orangepi = "$GITHUB_WORKSPACE/linux-openbmc-build"
          EXTERNALSRC:pn-u-boot-orangepi = "$GITHUB_WORKSPACE/u-boot-orangepi"
          EXTERNALSRC_BUILD:pn-u-boot-orangepi = "$GITHUB_WORKSPACE/u-boot-openbmc-build"
          CONNECTIVITY_CHECK_URIS = ""
          EOF

          zlib_tar="$GITHUB_WORKSPACE/yocto-downloads/zlib-1.3.2.tar.gz"
          zlib_expected="bb329a0a2cd0274d05519d61c667c062e06990d72e125ee2dfa8de64f0119d16"
          if [ -f "$zlib_tar" ] && [ "$(sha256sum "$zlib_tar" | awk '{print $1}')" != "$zlib_expected" ]; then
            echo 'Removing corrupted cached zlib-1.3.2.tar.gz before BitBake fetch'
            rm -f "$zlib_tar"
          fi

      - name: Build full OpenBMC image (checkpointable)
        id: build_image
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$GITHUB_WORKSPACE/openbmc"
          set +u
          . ./oe-init-build-env "$GITHUB_WORKSPACE/openbmc-build"
          set -u
          # Allow long native tasks to finish while leaving time for the
          # always-run cache-save step before the GitHub job limit.
          set +e
          timeout --signal=TERM --kill-after=5m 300m \
            bitbake obmc-phosphor-image 2>&1 | tee "$GITHUB_WORKSPACE/openbmc-bitbake.log"
          bitbake_rc=${PIPESTATUS[0]}
          set -e

          deploy="$GITHUB_WORKSPACE/openbmc-build/tmp/deploy/images/orangepi-zero2"
          if find "$deploy" -maxdepth 1 -type f -name '*.wic' -print -quit 2>/dev/null | grep -q .; then
            echo 'checkpointed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$bitbake_rc" -eq 124 ] || [ "$bitbake_rc" -eq 137 ] || [ "$bitbake_rc" -eq 143 ]; then
            echo "Checkpoint $CHECKPOINT_NUMBER reached; completed sstate will be saved."
            echo 'checkpointed=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo 'checkpointed=false' >> "$GITHUB_OUTPUT"
          exit "$bitbake_rc"

      # Preserve completed Yocto work even when BitBake fails.  The next run
      # restores this cache and reuses sstate instead of rebuilding everything.
      - name: Save Yocto downloads and sstate after build attempt
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            yocto-downloads
            yocto-sstate
          key: yocto-orangepi-zero2-${{ hashFiles('sources/versions.txt', 'meta-orangepi/**') }}-${{ github.run_id }}

      - name: Collect TF-card image and checksums
        if: >-
          success() &&
          steps.build_image.outputs.checkpointed != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          deploy="$GITHUB_WORKSPACE/openbmc-build/tmp/deploy/images/orangepi-zero2"
          out="$GITHUB_WORKSPACE/tf-card-image"
          test -d "$deploy"
          mkdir -p "$out"
          # The deliverable is the complete, directly flashable SD image.
          find "$deploy" -maxdepth 1 -type f -name '*.wic' \
            -exec cp -a {} "$out/" \;
          sha256sum "$out"/* | sort > "$out/SHA256SUMS"
          test -n "$(find "$out" -type f -name '*.wic' -print -quit)"

      - name: Upload TF-card image
        if: >-
          success() &&
          steps.build_image.outputs.checkpointed != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: orangepi-zero2-tf-card-image-${{ github.run_number }}
          path: tf-card-image/
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orangepi-zero2-build-diagnostics-${{ github.run_number }}
          path: |
            openbmc-bitbake.log
            openbmc-build/conf/*.conf
            openbmc-build/tmp/log/cooker/**
            openbmc-build/tmp/work/**/temp/log.do_*
          if-no-files-found: warn
          retention-days: 7

  continue-checkpointed-build:
    name: Continue checkpointed Yocto build
    needs: build
    if: >-
      needs.build.result == 'success' &&
      needs.build.outputs.checkpointed == 'true' &&
      fromJSON(inputs.checkpoint || '0') < 5
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch next checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKPOINT_NUMBER: ${{ inputs.checkpoint || '0' }}
        run: |
          set -Eeuo pipefail
          next_checkpoint=$((CHECKPOINT_NUMBER + 1))
          gh workflow run build-orangepi-zero2-image.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f checkpoint="$next_checkpoint"
